name: Fonctionnalité
description: Proposer une nouvelle fonctionnalité ou une amélioration
title: "[Fonctionnalité] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Décrire le besoin avant la solution aide à choisir la meilleure façon de le couvrir.

  - type: dropdown
    id: zone
    attributes:
      label: Partie concernée
      options:
        - Plugin navigateur
        - Application web (SvelteKit)
        - API (Rust)
        - Base de données
        - Autre ou je ne sais pas
    validations:
      required: true

  - type: textarea
    id: besoin
    attributes:
      label: Besoin
      description: Qui a besoin de quoi, et pourquoi.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Comportement attendu, sans détailler l'implémentation si ce n'est pas nécessaire.
    validations:
      required: true

  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: Une liste de conditions vérifiables pour considérer la fonctionnalité terminée.
      placeholder: |
        - Le tableau de bord affiche le total par domaine
        - Un compte sans mesure voit un message explicite
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Autres façons de répondre au besoin, s'il y en a.
    validations:
      required: false

  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications
      options:
        - label: J'ai cherché parmi les issues existantes sans trouver de doublon.
          required: true
