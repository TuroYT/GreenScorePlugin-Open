name: Bug
description: Signaler un comportement incorrect ou un plantage
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire le problème. Plus les étapes sont précises, plus il est rapide à corriger.

  - type: dropdown
    id: zone
    attributes:
      label: Partie concernée
      options:
        - Plugin navigateur
        - Application web (SvelteKit)
        - API (Rust)
        - Base de données
        - Autre ou je ne sais pas
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Ce qui ne fonctionne pas, en une ou deux phrases.
    validations:
      required: true

  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      description: Liste numérotée, à partir d'un état vierge si possible.
      placeholder: |
        1. Se connecter avec un compte membre
        2. Ouvrir la page des statistiques
        3. Observer le total affiché
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: observe
    attributes:
      label: Comportement observé
      description: Message d'erreur exact, capture d'écran, ou sortie de la console du navigateur.
    validations:
      required: true

  - type: input
    id: navigateur
    attributes:
      label: Navigateur et version
      description: Pour un bug du plugin, indiquer le navigateur et son système d'exploitation.
      placeholder: "Par exemple : Firefox 134 sous Linux"
    validations:
      required: false

  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications
      options:
        - label: J'ai cherché parmi les issues existantes sans trouver de doublon.
          required: true
