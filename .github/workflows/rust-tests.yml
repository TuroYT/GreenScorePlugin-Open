name: Tests Backend Rust

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  checks: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format et Clippy
    # Pas de runner Pitlane pour les PR venant d'un fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pitlane

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Vérification du formatage
        run: cargo fmt --check

      - name: Analyse Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests & Coverage
    # Pas de runner Pitlane pour les PR venant d'un fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pitlane

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: greenscoreweb_database
        # Port hôte attribué au hasard : deux jobs sur le même runner ne se disputent pas 3306.
        ports:
          - 3306
        # L'initialisation de MySQL peut dépasser 40 s sur un runner chargé : on ne compte pas les échecs pendant cette période.
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3 --health-start-period=60s

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview

      - name: Installation des outils
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Chargement du schéma de test
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -proot greenscoreweb_database < migrations/20260325091757_sql_test.sql

      - name: Exécution des tests et génération du rapport HTML
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/greenscoreweb_database
        run: |
          cargo llvm-cov nextest --all-features --workspace --ignore-filename-regex "src[/\\](main|cleanup|router)\.rs" --html

      - name: Sauvegarde du rapport HTML (Artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: backend/target/llvm-cov/html/
          retention-days: 7
