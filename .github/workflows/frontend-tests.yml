name: Tests Frontend

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifications:
    name: Svelte, lint et tests
    # Pas de runner Pitlane pour les PR venant d'un fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pitlane

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installation de Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification Svelte et TypeScript (svelte-check)
        run: npm run check

      - name: Lint (npm run lint, si le script existe)
        run: npm run lint --if-present

      - name: Tests Vitest (npm test, si le script existe)
        run: npm test --if-present
